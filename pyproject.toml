[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arbotts"
version = "2.0.0"
description = "Ultra-lightweight bilingual Indonesian & English Text-to-Speech"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "onnxruntime>=1.17.0",
    "phonemizer>=3.2.1",
    "espeakng-loader>=0.1.0",
    "scipy>=1.10.0",
    "librosa>=0.10.0",
    "edge-tts>=6.1.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
train = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "librosa>=0.10.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
]

[project.scripts]
arbotts = "arbotts.cli:main"
